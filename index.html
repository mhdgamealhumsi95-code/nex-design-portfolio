<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEX DESIGN | شريكك الإبداعي</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&family=Outfit:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. متغيرات الألوان --- */
        :root {
            --bg-color: #050505;
            --card-bg: #0f0f0f;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-purple: #B04CE0;
            --accent-cyan: #4CC9E0;
            --gradient-main: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            --glow: 0 0 20px rgba(176, 76, 224, 0.3);
        }

        /* --- 2. إعدادات عامة --- */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* --- 3. الهيدر --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            
            /* خلفية زجاجية */
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 1001;
        }
        
        /* زر القائمة (3 شخطات) - مخفي عاللابتوب */
        .hamburger {
            display: none;
            font-size: 1.8rem;
            color: white;
            cursor: pointer;
            z-index: 1002;
        }

        /* تنسيق القائمة */
        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        /* تنسيق الروابط */
        nav a {
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.3s;
        }
        nav a:hover { color: var(--text-secondary); }

        .btn-main {
            padding: 10px 25px;
            background: var(--gradient-main);
            color: white;
            font-weight: 700;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(176, 76, 224, 0.4);
            display: inline-block;
        }

        /* --- 4. قسم البداية (Hero) --- */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 80px;
            
            /* الخلفية */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: white;
            position: relative;
        }

        /* --- 5. قسم "عني" (About Me) --- */
        .about-section {
            padding: 100px 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            background: #080808;
        }
        
        .about-image {
            flex: 1;
            max-width: 400px;
            position: relative;
        }
        .about-image img {
            width: 100%;
            border-radius: 20px;
            box-shadow: var(--glow);
            border: 2px solid var(--accent-purple);
        }

        .about-text {
            flex: 1.5;
        }
        .about-text h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .about-text h3 { color: var(--text-secondary); margin-bottom: 20px; font-weight: 400; }
        .about-text p { color: #ccc; font-size: 1.1rem; line-height: 1.8; }

        /* --- 6. قسم الفيديو --- */
        .video-section {
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }

            width: 100%;
            height: 10
